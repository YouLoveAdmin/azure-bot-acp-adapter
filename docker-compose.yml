version: "3.9"

services:
  bot:
    image: ghcr.io/youloveadmin/azure-bot-acp-adapter:latest
    pull_policy: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3978:3978"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
